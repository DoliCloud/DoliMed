# This is the YAML file to describe the location of a module

packages:
  - modulename: 'CabinetMed'
    author: 'DoliCloud'
    author_url: 'https://www.dolimed.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "DoliMed"
      en: "DoliMed"
    description:
      fr: "Module DoliMed - Gestion des patients et des consultations pour les cabinets médicaux"
      en: "Module DoliMed - Manage your patients and consultations for medical offices"
    status: 'enabled'
    created_at: '2011-01-23'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/DoliMed/tree/develop/htdocs/cabinetmed'
    git-branch: 'develop'
    git-system: 'github'
    cover: 'https://raw.githubusercontent.com/DoliCloud/DoliMed/develop/htdocs/cabinetmed/img/dolimed_logo.png'
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    # Example: https://www.dolistore.com/product.php?id=xxx
    dolistore-download: 'https://www.dolistore.com/product.php?id=1764'
